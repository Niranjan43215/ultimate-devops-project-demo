name: product-catalog-ci

on:
  push:
    branches:
      - ci-test

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: product-catalog
  SERVICE_PATH: src/product-catalog

permissions:
  contents: read

jobs:
  code-scan:
    name: Stage 1: Checkout + Code Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gramener BuildErrors
        run: |
          echo "Running Gramener BuildErrors on $SERVICE_PATH"
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            gramener/builderrors \
            --path "$SERVICE_PATH" \
            --format json \
            --output builderrors-product-catalog.json \
            --include-patterns "*"

      - name: Upload BuildErrors report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builderrors-report
          path: builderrors-product-catalog.json

  build-and-scan-image:
    name: Stage 2/3/4: Build Docker image and scan with Snyk
    needs: code-scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Docker image metadata
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_URI" "$SERVICE_PATH"

      - name: Set up Node.js for Snyk
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Authenticate to Snyk
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "SNYK_TOKEN is not set"
            exit 1
          fi
          echo "$SNYK_TOKEN" | snyk auth --stdin

      - name: Scan Docker image with Snyk
        run: |
          snyk container test "$IMAGE_URI" --dockerfile "$SERVICE_PATH/Dockerfile"

  push-to-ecr:
    name: Stage 5: Push Docker image to ECR
    needs: build-and-scan-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Push Docker image to ECR
        run: |
          docker push "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${GITHUB_SHA}"